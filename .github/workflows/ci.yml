name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `ru.ts` is typed as `typeof en`, so a missing translation key is a
      # compile error, not just a failing assertion.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The build refuses to run without SITE_URL — it's the origin for every
      # absolute URL it emits. CI only checks that the build compiles; dist/
      # is never deployed from here. So a repo that hasn't set the SITE_URL
      # variable (Settings → Secrets and variables → Actions → Variables)
      # builds against a reserved placeholder instead of failing. Set the
      # variable to build against your real origin.
      - name: Build
        run: npx vite build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ci.invalid' }}
