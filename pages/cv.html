<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png" />
  <!-- 120×120 is the size Yandex reads for the favicon in its search results -->
  <link rel="icon" type="image/png" sizes="120x120" href="/assets/icons/favicon-120x120.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <!-- title, meta, canonical, hreflang and JSON-LD are injected at build
       time from profile.config.ts — see vite.config.ts -->
</head>
<body>

<canvas id="matrix" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="crt" aria-hidden="true"></div>

<div class="wrap">
  <div class="topbar"><!--CV_TOPBAR--></div>

  <main class="term">
    <div class="term-head">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="term-title"><!--CV_TITLE--></span>
    </div>
    <div class="term-body"><!--CV--></div>
  </main>

  <footer><!--CV_FOOTER--></footer>
</div>

<script type="module" src="/src/cv.ts"></script>
</body>
</html>
